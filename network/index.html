    * {

    body {

      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      grid-template-rows: repeat(4, 1fr);
      gap: 16px;
      width: 100vw;
      height: 100vh;
      padding: 16px;
      position: relative;
    }
    .site-card {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      text-decoration: none;
      position: relative;
      z-index: 1;
    }
    .site-card:hover {
      transform: scale(1.05);
    }
    /* When a card is clicked */
    .site-card.clicked {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    /* Other cards when one is clicked */
    .grid:has(.site-card.clicked) .site-card:not(.clicked) {
      opacity: 0.1;
    }
  </style>
</head>
