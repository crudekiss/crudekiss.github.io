<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Fallback redirect for non-JS browsers, timed slightly later -->
  <meta http-equiv="refresh" content="3.2; url=https://crudekiss.itch.io/rise-of-the-orc-tyrant">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div id="message">Redirecting… [3.0s]</div>

  <script>
    const message = document.getElementById('message');
    let timeLeft = 3.0;

    const countdown = setInterval(() => {
      timeLeft = +(timeLeft - 0.1).toFixed(1);

      if (timeLeft <= 0.0) {
        clearInterval(countdown);
        message.textContent = ""; // Fully black screen
      } else {
        message.textContent = `Redirecting… [${timeLeft.toFixed(1)}s]`;
      }

      // Start redirect at 0.3s
      if (timeLeft === 0.3) {
        setTimeout(() => {
          window.location.href = "https://crudekiss.itch.io/rise-of-the-orc-tyrant";
        }, 0); // Start redirect instantly at 0.1s mark
      }
    }, 100);
  </script>

  <noscript>
    <div style="text-align: center;">
      <a href="https://crudekiss.itch.io/rise-of-the-orc-tyrant" style="color: #0af;">Click here</a> if not redirected.
    </div>
  </noscript>
</body>
</html>
