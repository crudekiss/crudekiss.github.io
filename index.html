<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crudekiss.github.io</title>
  <meta name="theme-color" content="#000000" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Roboto Mono', monospace; }
    .button { transition: transform 0.35s ease-in-out, box-shadow 0.35s ease-in-out; }
    .button:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.15); }
    .button-text { text-shadow: 1px 1px 3px rgba(0,0,0,0.3); text-transform: uppercase; font-weight: 700; }
  </style>
</head>
<body class="h-screen w-screen m-0 p-0 flex items-center justify-center bg-black">
  <div class="w-full h-full md:w-[75vw] md:h-[75vh] md:max-w-[999px] md:max-h-[700px] p-4 box-border">
    <div class="grid grid-cols-1 grid-rows-4 md:grid-cols-2 md:grid-rows-2 gap-6 h-full w-full">

      <!-- Games -->
      <a href="https://crudekiss.itch.io/" target="_blank"
         class="button bg-gradient-to-b from-lime-300 to-emerald-600 rounded-2xl flex flex-col items-start justify-start p-6 text-black w-full h-full">
        <span class="button-text text-[1.8rem] sm:text-3xl lg:text-4xl">Games</span>
        <p class="text-sm sm:text-base lg:text-lg opacity-80">Explore our portfolio</p>
      </a>

      <!-- Discord -->
      <a href="https://discord.gg/KzZ44NKZrY" target="_blank"
         class="button bg-gradient-to-b from-indigo-400 to-purple-800 rounded-2xl flex flex-col items-start justify-start p-6 text-white w-full h-full">
        <span class="button-text text-[1.8rem] sm:text-3xl lg:text-4xl">Discord</span>
        <p class="text-sm sm:text-base lg:text-lg opacity-80">Join our community</p>
      </a>

      <!-- Support -->
      <a href="https://www.patreon.com/c/crudekiss/membership" target="_blank"
         class="button bg-gradient-to-b from-rose-400 to-red-800 rounded-2xl flex flex-col items-start justify-start p-6 text-white w-full h-full">
        <span class="button-text text-[1.8rem] sm:text-3xl lg:text-4xl">Support</span>
        <p class="text-sm sm:text-base lg:text-lg opacity-80">Help fund our work</p>
      </a>

      <!-- Contact -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeI_MN3o5AdehFV_eanQYysmeUQyA9j02j8a8_ut9VBlk8EDQ/viewform" target="_blank"
         class="button bg-gradient-to-b from-slate-300 to-zinc-700 rounded-2xl flex flex-col items-start justify-start p-6 text-black w-full h-full">
        <span class="button-text text-[1.8rem] sm:text-3xl lg:text-4xl">Contact</span>
        <p class="text-sm sm:text-base lg:text-lg opacity-80">Connect with us</p>
      </a>
      
    </div>
  </div>
</body>
</html>
