<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>crudekiss.github.io</title>
  <meta name="theme-color" content="#000000"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    /* RESET & BASE */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      font-family: 'Roboto Mono', monospace;
    }

    /* OUTER WRAPPER */
    .container {
      width: 100%; height: 100%;
      padding: 1rem;
      max-width: 999px;    /* matches md:max-w-[999px] */
      max-height: 700px;   /* matches md:max-h-[700px] */
    }

    /* GRID LAYOUT */
    .grid {
      display: grid;
      width: 100%; height: 100%;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: 1.5rem;         /* gap-6 */
    }

    /* CARD BASE */
    .card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%; height: 100%;
      padding: 1.5rem;     /* p-6 */
      border-radius: 1rem; /* rounded-2xl */
      text-decoration: none;
      transition: transform .35s ease-in-out,
                  box-shadow .35s ease-in-out;
    }
    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2),
                  0 5px 15px rgba(0,0,0,0.15);
    }

    /* TYPOGRAPHY */
    .title {
      margin: 0;
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
      font-size: 1.8rem;   /* text-[1.8rem] */
    }
    .description {
      margin-top: .5rem;
      opacity: .8;
      font-size: .875rem;  /* text-sm */
      margin: 0;
    }

    /* CARD COLORS & GRADIENTS */
    .games   { background: linear-gradient(to bottom, #d9f99d, #047857); color: #000; }
    .discord { background: linear-gradient(to bottom, #818cf8, #6b21a8); color: #fff; }
    .patreon { background: linear-gradient(to bottom, #fb7185, #991b1b); color: #fff; }
    .contact { background: linear-gradient(to bottom, #cbd5e1, #3f3f46); color: #000; }

    /* SMALL SCREENS ≥640px (sm) */
    @media (min-width: 640px) {
      .title       { font-size: 1.875rem; } /* sm:text-3xl */
      .description { font-size: 1rem; }      /* sm:text-base */
    }

    /* MEDIUM SCREENS ≥768px (md) */
    @media (min-width: 768px) {
      .container { width: 75vw; height: 75vh; } 
      .grid {
        grid-template-columns: repeat(2,1fr);
        grid-template-rows: repeat(2,1fr);
      }
    }

    /* LARGE SCREENS ≥1024px (lg) */
    @media (min-width: 1024px) {
      .title       { font-size: 2.25rem; } /* lg:text-4xl */
      .description { font-size: 1.125rem;} /* lg:text-lg  */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="grid">

      <!-- Games -->
      <a href="https://crudekiss.itch.io/" target="_blank" class="card games">
        <h2 class="title">Games</h2>
        <p class="description">Explore our portfolio</p>
      </a>

      <!-- Discord -->
      <a href="https://discord.gg/KzZ44NKZrY" target="_blank" class="card discord">
        <h2 class="title">Discord</h2>
        <p class="description">Join our community</p>
      </a>

      <!-- Patreon -->
      <a href="https://www.patreon.com/c/crudekiss/membership" target="_blank" class="card patreon">
        <h2 class="title">Patreon</h2>
        <p class="description">Help fund our work</p>
      </a>

      <!-- Contact -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeI_MN3o5AdehFV_eanQYysmeUQyA9j02j8a8_ut9VBlk8EDQ/viewform" 
         target="_blank" class="card contact">
        <h2 class="title">Contact</h2>
        <p class="description">Connect with us</p>
      </a>

    </div>
  </div>
</body>
</html>
