    // Retrieve all site cards.
    const siteCards = document.querySelectorAll('.site-card');
    
    // Assign each a unique random keyword from the list.
    // We shuffle a copy of the keywords array to guarantee uniqueness.
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    
    const randomizedKeywords = shuffleArray([...searchKeywords]);
    
    siteCards.forEach((card, index) => {
      // Get the keyword for this card (if not enough, default to "solo").
      const keyword = randomizedKeywords[index] || "solo";
      
      // Set a click event on each card.
      card.addEventListener('click', function(e) {
        // Prevent default navigation.
        e.preventDefault();
        // Retrieve the search base URL from the data attribute.
        const baseURL = card.getAttribute('data-search-base');
        // Construct the full URL.
        const searchURL = baseURL + encodeURIComponent(keyword);
        // Open the URL in a new tab.
        window.open(searchURL, '_blank');
      });
    });
